<section class="grid">
  <div class="card chart-card">
    <header>
      <div>
        <h2>Variación porcentual</h2>
        <p>Comparación en tiempo real de los pares seleccionados</p>
      </div>
      <app-pair-selector
        [pairs]="availablePairs"
        [selectedQuotes]="selectedQuotes"
        (selectionChange)="onSelectionChange($event)">
      </app-pair-selector>
    </header>
    <div class="chart-wrapper" *ngIf="!loading">
      <canvas baseChart
              [data]="lineChartData"
              [options]="lineChartOptions"
              [type]="lineChartType">
      </canvas>
    </div>
    <div class="chart-placeholder" *ngIf="loading">
      Cargando datos...
    </div>
  </div>
  <app-news-panel></app-news-panel>
</section>
